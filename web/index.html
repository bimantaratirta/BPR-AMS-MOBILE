<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="BPR Sahabat Sejati - Sistem Kehadiran">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BPR AMS">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>BPR AMS - Kehadiran</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // Pada web, setiap refresh selalu mulai dari route awal (splash screen).
    // GetX membaca URL hash untuk routing — kita reset agar Flutter
    // selalu navigasi ke initialRoute (SPLASH_SCREEN) bukan ke route terakhir.
    if (window.location.hash && window.location.hash !== '#/') {
      window.history.replaceState(null, document.title, window.location.pathname);
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
